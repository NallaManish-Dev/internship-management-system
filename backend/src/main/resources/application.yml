spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: internship-management-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/internship_management}
      database: ${MONGODB_DATABASE:internship_management}
      auto-index-creation: true
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: WARN
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
